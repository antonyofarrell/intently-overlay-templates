<!-- Overlay V4 Template -->
<smc-bg class="smc-animated smc-fadeIn">
  <smc-overlay-outer class="smc-animated smc-fadeInDown smc-animDelay2">
    <smc-overlay-inner class="smc_clearfix" data-changes="smc-overlay-inner|width,background-image,background-color">

      <smc-text-outer>
        <smc-text class="smc-text1">{text1}</smc-text>
        <smc-text class="smc-text2">{text2}</smc-text>
      </smc-text-outer>

      <smc-cart>
        <smc-product>
          <smc-product-img><img src="https://cdn.smct.io/123117-563.webp" alt=""></smc-product-img>
          <smc-wrap>
            <smc-text class="smc-text-mobile">{text1}</smc-text>
            <smc-product-name>Product name</smc-product-name>
            <smc-prices>
              <smc-old-price>£20.00</smc-old-price><smc-product-price>£10.00</smc-product-price>
            </smc-prices>
          </smc-wrap>
          <!-- Click To Redirect Option -->
          <smc-option class="smc-clickRedirect">
            <smc-input-group>
              <span class="smc-button" data-edits="text10" data-changes=".smc-button|font-size,background-color,color">{text10}</span>
            </smc-input-group>
          </smc-option>
        </smc-product>
      </smc-cart>

      <!-- Closers (Both Need) -->
      <smc-long-close data-engage-class="smc-engaged">
        <a data-close-type="long_close" class="smc-link smc-closer" href="#rdl" data-engage-text="{text11}" data-edits="text7,text11">{text7}</a>
      </smc-long-close>

      <smc-close class="smc-closer">
        <a data-close-type="x_close" class="smc-link" href="#rdl">✕</a>
      </smc-close>

    </smc-overlay-inner>
  </smc-overlay-outer>
</smc-bg>
