<smc-bg class="smc-animated smc-fadeIn">
    <smc-overlay-outer class="smc-animated smc-bounceInDown smc-animDelay2">
        <smc-overlay-inner class="smc_clearfix" data-bgtheme="dark" data-changes="smc-overlay-inner|width,background-image,background-color" data-edits="content6"><!-- If the background is dark use this option -->

            <smc-text-outer>
                <smc-text class="smc-text1 smc-animated smc-bounceInDown smc-animDelay4">{text1}</smc-text>
                <smc-text class="smc-text2 smc-animated smc-bounceInDown smc-animDelay6">{text2}</smc-text>
                <smc-text class="smc-text3 smc-animated smc-bounceInDown smc-animDelay8">{text3}</smc-text>
            </smc-text-outer>
            <smc-option class="smc-clickRedirect">
                <smc-input-group>
                    <span class="smc-button smc-animated smc-bounceInDown smc-animDelay10">{text10}</span>
                </smc-input-group>
            </smc-option>
            <smc-long-close class="smc-animated smc-fadeInUp smc-animDelay6" data-engage-class="smc-engaged">
                <a data-close-type="long_close" class="smc-link smc-closer" href="#rdl" data-engage-text="{text11}" aria-label="Close Dialogue Box">{text7}</a>
            </smc-long-close>
            <smc-close class="smc-animated smc-fadeInRight smc-animDelay4 smc-closer">
                <a class="smc-link" aria-label="Close Dialogue Box">✕</a>
            </smc-close>
        </smc-overlay-inner>
    </smc-overlay-outer>
</smc-bg>
