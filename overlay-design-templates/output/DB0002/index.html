<!-- Overlay V4 Template -->
<smc-bg class="smc-animated smc-fadeIn">
  <smc-overlay-outer class="smc-animated smc-fadeIn smc-animDelay2">
    <!--  data-animout="smc-bounceOutLeft" -->
    <smc-overlay-inner
      class="smc_clearfix"
      data-bgtheme="dark"
      data-changes="smc-overlay-inner|width,background-image,background-color"
      data-edits="content6">
      <!-- If the background is dark use this option -->

      <smc-close class="smc-animated smc-bounceInRight smc-animDelay4 smc-closer">
        <a data-close-type="x_close" class="smc-link" href="#rdl">✕</a>
        <!-- Note - Redirect Link gets automatically rewritten -->
      </smc-close>

      <smc-wrap>
        <smc-text-outer>
          <smc-text
            class="smc-text1 smc-animated smc-bounceInRight smc-animDelay8"
            data-edits="text1"
            data-changes=".smc-text1|font-size,color,margin-top,margin-bottom">
            {text1}
          </smc-text>
          <smc-text
            class="smc-text2 smc-animated smc-bounceInRight smc-animDelay10"
            data-edits="text2"
            data-changes=".smc-text2|font-size,color,margin-top,margin-bottom">
            {text2}
          </smc-text>
          <smc-text
            class="smc-text3 smc-animated smc-bounceInLeft smc-animDelay8"
            data-edits="text3"
            data-changes=".smc-text3|font-size,color,margin-top,margin-bottom">
            {text3}
          </smc-text>
          <smc-text
            class="smc-text4 smc-animated smc-bounceInRight smc-animDelay10"
            data-edits="text4"
            data-changes=".smc-text4|font-size,color,margin-top,margin-bottom">
            {text4}
          </smc-text>
        </smc-text-outer>

        <smc-option class="smc-clickRedirect">
          <smc-input-group>
            <span
              class="smc-button smc-animated smc-bounceInRight smc-animDelay12"
              data-edits="text10"
              data-changes=".smc-button|font-size,background-color,color">
              {text10}
            </span>
          </smc-input-group>
        </smc-option>
      </smc-wrap>

      <smc-cart class="smc-animated smc-bounceInUp smc-animDelay14">
        <smc-cart-icon><img src="https://cdn.smct.io/94273-626.svg" /></smc-cart-icon>
        <smc-product>
          <smc-left>
            <smc-product-img>
              <img
                src="https://enjoybettercoffee.com/cdn/shop/files/JC008KronungGround500g1000x1000.jpg?v=1749155805&amp;width=600" />
            </smc-product-img>
          </smc-left>
          <smc-right>
            <smc-product-name>Jacobs Kronung Ground Coffee 17.6oz/500g</smc-product-name>
            <smc-product-desc>JC008</smc-product-desc>
            <smc-prices>
              <smc-old-price></smc-old-price>
              <smc-product-price>$16.67</smc-product-price>
            </smc-prices>
          </smc-right>
        </smc-product>
      </smc-cart>

      <!-- Scrolling Marquee Section -->
      <div class="smc-scrolling-text-container">
        <div class="smc-scrolling-text-inner" style="--marquee-speed: 15s; --direction: smc-scroll-left" role="marquee">
          <div class="smc-scrolling-text">
            <div class="smc-scrolling-text-item">USP number 1</div>
            <div class="smc-scrolling-text-item">USP number 2</div>
            <div class="smc-scrolling-text-item">USP number 3</div>
          </div>

          <div class="smc-scrolling-text">
            <div class="smc-scrolling-text-item">USP number 1</div>
            <div class="smc-scrolling-text-item">USP number 2</div>
            <div class="smc-scrolling-text-item">USP number 3</div>
          </div>
        </div>
      </div>
      <!-- Scrolling Marquee Section End -->

      <smc-long-close class="smc-animated smc-fadeInUp smc-animDelay14" data-engage-class="smc-engaged">
        <a
          href="#rdl"
          data-close-type="long_close"
          class="smc-link smc-closer"
          data-engage-text="{text11}"
          data-edits="text7,text11"
          data-changes="smc-long-close a.smc-link|font-size,color,margin-top,margin-bottom">
          {text7}
        </a>
        <!-- Note - Redirect Link gets automatically rewritten, once clicked on the data-engage text and classes are applied -->
      </smc-long-close>
    </smc-overlay-inner>
  </smc-overlay-outer>
</smc-bg>
