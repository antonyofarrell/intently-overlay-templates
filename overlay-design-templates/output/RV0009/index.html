<!-- Overlay V4 Template -->
<smc-bg class="smc-animated smc-fadeIn">
  <smc-overlay-outer class="smc-animated smc-bounceInDown smc-animDelay2">
    <!--  data-animout="smc-bounceOutLeft" -->
    <smc-overlay-inner class="smc_clearfix" data-bgtheme="dark" data-changes="smc-overlay-inner|width,background-image,background-color" data-edits="content6">
      <!-- If the background is dark use this option -->

      <!-- Images - You can add as many as you like -->
      <smc-img-outer>
        <smc-img class="smc-img1 smc-animated smc-bounceInDown smc-animDelay6" data-changes=".smc-img1|margin-top,margin-bottom,image-upload" data-edits="content1">
          <img src="{content1}" alt="">
        </smc-img>
      </smc-img-outer>

      <smc-wrap>
        <!-- Text Boxes - You can add as many as you like -->
        <smc-text-outer>
          <smc-text class="smc-text1 smc-animated smc-bounceInDown smc-animDelay2" data-edits="text1" data-changes=".smc-text1|font-size,color,margin-top,margin-bottom">
            {text1}
          </smc-text>
          <smc-text class="smc-text2 smc-animated smc-bounceInRight smc-animDelay4" data-edits="text2" data-changes=".smc-text2|font-size,color,margin-top,margin-bottom">
            {text2}
          </smc-text>
          <smc-text class="smc-text3 smc-animated smc-bounceInLeft smc-animDelay8" data-edits="text3" data-changes=".smc-text3|font-size,color,margin-top,margin-bottom">
            {text3}
          </smc-text>
          <smc-text class="smc-text4 smc-animated smc-bounceInRight smc-animDelay10" data-edits="text4" data-changes=".smc-text4|font-size,color,margin-top,margin-bottom">
            {text4}
          </smc-text>
        </smc-text-outer>

        <!-- Click To Reveal Option -->
        <smc-option class="smc-clickToReveal">
          <smc-reveal class="smc-animated smc-bounceInUp smc-animDelay6">
            <smc-cover data-edits="text8" data-changes=".smc-clickToReveal smc-cover|font-size,background-color,color">
              {text8}
            </smc-cover>
            <smc-code>{vc}</smc-code>
            <smc-cp data-clipboard-text="{vc-cp}"></smc-cp>
          </smc-reveal>

          <!-- Closers (Both Need) -->
          <smc-long-close class="smc-animated smc-fadeInUp smc-animDelay2" data-engage-class="smc-engaged">
            <a data-close-type="long_close" class="smc-link smc-closer" href="#rdl" data-engage-text="{text11}" data-edits="text7,text11" data-changes="smc-long-close a.smc-link|font-size,color,margin-top,margin-bottom">
              {text7}
            </a>
            <!-- Note - Redirect Link gets automatically rewritten, once clicked on the data-engage text and classes are applied -->
          </smc-long-close>


        </smc-option>


      </smc-wrap>

      <smc-close class="smc-animated smc-fadeInRight smc-animDelay4 smc-closer">
        <a data-close-type="x_close" class="smc-link" href="#rdl">✕</a>
        <!-- Note - Redirect Link gets automatically rewritten -->
      </smc-close>

      <!-- Copy to Clipboard Success Message -->
      <smc-cp-msg>"{vc}" has been copied to the clipboard</smc-cp-msg>
    </smc-overlay-inner>
  </smc-overlay-outer>
</smc-bg>
