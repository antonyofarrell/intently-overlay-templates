<!-- Overlay V4 Template -->
<smc-bg class="smc-animated smc-fadeIn">
  <smc-overlay-outer class="smc-animated smc-bounceInDown smc-animDelay2">
    <!--  data-animout="smc-bounceOutLeft" -->
    <smc-overlay-inner
      class="smc_clearfix"
      data-bgtheme="dark"
      data-changes="smc-overlay-inner|width,background-image,background-color"
      data-edits="content6"
      ><!-- If the background is dark use this option -->

      <smc-side>
        <smc-text
          class="smc-text1 smc-animated smc-bounceInDown smc-animDelay4"
          data-edits="text1"
          data-changes=".smc-text1|font-size,color,margin-top,margin-bottom"
          >{text1}</smc-text
        >
        <smc-text
          class="smc-text2 smc-animated smc-bounceInRight smc-animDelay6"
          data-edits="text2"
          data-changes=".smc-text2|font-size,color,margin-top,margin-bottom"
          >{text2}</smc-text
        >
      </smc-side>

      <smc-cart>
        <smc-product>
          <smc-left>
            <smc-product-img
              ><img
                src="https://alppibaby.com/cdn/shop/files/Bundles_d084443b-8b46-4b12-b0bf-c81e00338cc1.webp?v=1773061636&amp;width=1920"
            /></smc-product-img>
          </smc-left>
          <smc-right>
            <smc-product-name
              >Alppi Wispy Cloud Diaper Bundles</smc-product-name
            >
            <smc-product-desc>
              Experience the comfort of Alppi Wispy Cloud Diaper Bundles for
              your little one.
            </smc-product-desc>
            <smc-prices>
              <smc-product-price>$57.30</smc-product-price>
              <smc-old-price>$63.40</smc-old-price>
            </smc-prices>
            <!-- Click To Redirect Option -->
            <smc-option class="smc-clickRedirect">
              <smc-input-group>
                <span
                  class="smc-button smc-animated smc-fadeInRight smc-animDelay10"
                  data-edits="text10"
                  data-changes=".smc-button|font-size,background-color,color"
                  >{text10}</span
                >
              </smc-input-group>
            </smc-option>
          </smc-right>
        </smc-product>
      </smc-cart>

      <!-- Closers (Both Need) -->
      <smc-long-close
        class="smc-animated smc-fadeInUp smc-animDelay14"
        data-engage-class="smc-engaged"
      >
        <a
          data-close-type="long_close"
          class="smc-link smc-closer"
          href="#rdl"
          data-engage-text="{text11}"
          data-edits="text7,text11"
          data-changes="smc-long-close a.smc-link|font-size,color,margin-top,margin-bottom"
          >{text7}</a
        >
        <!-- Note - Redirect Link gets automatically rewritten, once clicked on the data-engage text and classes are applied -->
      </smc-long-close>

      <smc-close class="smc-animated smc-fadeInRight smc-animDelay4 smc-closer">
        <a data-close-type="x_close" class="smc-link" href="#rdl">✕</a
        ><!-- Note - Redirect Link gets automatically rewritten -->
      </smc-close>
    </smc-overlay-inner>
  </smc-overlay-outer>
</smc-bg>
