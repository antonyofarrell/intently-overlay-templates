<!-- Overlay V4 Template -->
<smc-bg class="smc-animated smc-fadeIn">
  <smc-overlay-outer class="smc-animated smc-bounceInDown smc-animDelay2"> <!--  data-animout="smc-bounceOutLeft" -->
    <smc-overlay-inner class="smc_clearfix smc-gradient" data-bgtheme="dark" data-changes="smc-overlay-inner|width,background-image,background-color" data-edits="content6"><!-- If the background is dark use this option -->

      <smc-text-outer>
        <smc-text class="smc-text1">{text1}</smc-text>
        <smc-text class="smc-text2">{text2}</smc-text>
      </smc-text-outer>


      <smc-cart>
        <smc-product>
          <smc-product-img><img src="https://www.charlestyrwhitt.com/dw/image/v2/AAWJ_PRD/on/demandware.static/-/Sites-ctshirts-master/default/dw6425052d/KNM/KNM0019LST/KNM0019LST_MODEL_UNTUCKED_01.jpg?sw=68&amp;sh=85"></smc-product-img>
          <smc-wrap>
            <smc-product-name>Pure Merino Textured Quarter Zip Jumper - Limestone</smc-product-name>
            <smc-prices>
              <smc-old-price></smc-old-price><smc-product-price>€99.95</smc-product-price>
            </smc-prices>
          </smc-wrap>
        </smc-product>


        <smc-product>
          <smc-product-img><img src="https://www.charlestyrwhitt.com/dw/image/v2/AAWJ_PRD/on/demandware.static/-/Sites-ctshirts-master/default/dw289c3763/KNT/KNT0022NAV/KNT0022NAV_MODEL_FRONT_01.jpg?sw=960&amp;sh=1200"></smc-product-img>
          <smc-wrap>
            <smc-product-name> Cotton Long Sleeve Textured Knitted Polo - Navy Blue </smc-product-name>
            <smc-prices>
              <smc-old-price></smc-old-price><smc-product-price>€89.95</smc-product-price>
            </smc-prices>
          </smc-wrap>
        </smc-product>


      </smc-cart>



      <smc-wrap class="smc-row">

      <smc-total> Total €189.90 </smc-total>


        <!-- Click To Redirect Option -->
        <smc-option class="smc-clickRedirect">
          <smc-input-group>
            <span class="smc-button smc-animated smc-fadeInRight smc-animDelay10" data-edits="text10" data-changes=".smc-button|font-size,background-color,color">{text10}</span>
          </smc-input-group>
        </smc-option>

      </smc-wrap>


      <!-- Closers (Both Need) -->
      <smc-long-close class="smc-animated smc-fadeInUp smc-animDelay14" data-engage-class="smc-engaged">
        <a data-close-type="long_close" class="smc-link smc-closer" href="#rdl" data-engage-text="{text11}" data-edits="text7,text11" data-changes="smc-long-close a.smc-link|font-size,color,margin-top,margin-bottom">{text7}</a>
        <!-- Note - Redirect Link gets automatically rewritten, once clicked on the data-engage text and classes are applied -->
      </smc-long-close>

      <smc-close class="smc-animated smc-fadeInRight smc-animDelay4 smc-closer">
        <a data-close-type="x_close" class="smc-link" href="#rdl">✕</a><!-- Note - Redirect Link gets automatically rewritten -->
      </smc-close>




      <!-- CSS Loader -->
      <smc-loader-bg data-theme="white"><!-- white, black-->
        <smc-loader-single></smc-loader-single><!-- single, double, pulse -->
      </smc-loader-bg>


    </smc-overlay-inner>

  </smc-overlay-outer>

</smc-bg>
