<!-- Overlay V4 Template -->
<smc-bg class="smc-animated smc-fadeIn">
  <smc-overlay-outer class="smc-animated smc-bounceInDown smc-animDelay2">
    <!--  data-animout="smc-bounceOutLeft" -->
    <smc-overlay-inner
      class="smc_clearfix"
      data-bgtheme="dark"
      data-changes="smc-overlay-inner|width,background-image,background-color"
      data-edits="content6"
      ><!-- If the background is dark use this option -->

      <!-- Images - You can add as many as you like -->
      <smc-img-outer>
        <smc-img class="smc-img1 smc-animated smc-bounceInDown smc-animDelay6"
          ><img src="{content1}" alt=""
        /></smc-img>

        <smc-img class="smc-img2"><img src="{content2}" alt="" /></smc-img>
        <smc-img class="smc-img3 smc-animated smc-bounceInRight smc-animDelay10"
          ><img src="{content3}" alt=""
        /></smc-img>
        <smc-img class="smc-img4 smc-animated smc-bounceInRight smc-animDelay12"
          ><img src="{content4}" alt=""
        /></smc-img>
      </smc-img-outer>

      <!-- Text Boxes - You can add as many as you like -->
      <smc-text-outer>
        <smc-text class="smc-text1 smc-animated smc-bounceInDown smc-animDelay4"
          >{text1}</smc-text
        >
        <smc-text
          class="smc-text2 smc-animated smc-bounceInRight smc-animDelay6"
          >{text2}</smc-text
        >
        <smc-text
          class="smc-text4 smc-animated smc-bounceInRight smc-animDelay10"
          >{text4}</smc-text
        >
      </smc-text-outer>

      <smc-email-wrap>
        <smc-text class="smc-text3 smc-animated smc-fadeIn smc-animDelay6"
          >{text3}</smc-text
        >
        <!-- Email To Reveal Option -->
        <smc-option class="smc-emailToReveal">
          <smc-input-group data-engage-class="smc-eng"
            ><input
              class="smc-input smc-animated smc-fadeInLeft smc-animDelay8"
              name="email"
              autocomplete="smc-autocomplete"
              data-required="true"
              data-verify="email"
              placeholder="{text9}"
              type="text"
          /></smc-input-group>
          <smc-reveal class="smc-animated smc-fadeInRight smc-animDelay10">
            <smc-cover
              data-edits="text9"
              data-changes=".smc-emailToReveal smc-cover|font-size,background-color,color"
              >{text12}</smc-cover
            >
            <smc-code>{vc}</smc-code>
            <smc-cp data-clipboard-text="{vc-cp}"></smc-cp>
          </smc-reveal>
          <smc-long-close
            class="smc-animated smc-fadeInUp smc-animDelay4"
            data-engage-class="smc-engaged"
          >
            <a
              data-close-type="long_close"
              class="smc-link smc-closer"
              href="#rdl"
              data-engage-text="{text11}"
              >{text7}</a
            >
          </smc-long-close>
        </smc-option>
      </smc-email-wrap>

      <smc-close class="smc-animated smc-fadeInRight smc-animDelay4 smc-closer">
        <a data-close-type="x_close" class="smc-link" href="#rdl">✕</a
        ><!-- Note - Redirect Link gets automatically rewritten -->
      </smc-close>

      <!-- Copy to Clipboard Success Message -->
      <smc-cp-msg>"{vc}" has been copied to the clipboard</smc-cp-msg>
    </smc-overlay-inner>
  </smc-overlay-outer>
</smc-bg>
