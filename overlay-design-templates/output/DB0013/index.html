<!-- Overlay V4 Template -->
<smc-bg class="smc-animated smc-fadeIn">
  <smc-overlay-outer class="smc-animated smc-bounceInDown smc-animDelay2">
    <!--  data-animout="smc-bounceOutLeft" -->
    <smc-overlay-inner
      class="smc_clearfix"
      data-bgtheme="dark"
      data-changes="smc-overlay-inner|width,background-image,background-color"
      data-edits="content6"
      ><!-- If the background is dark use this option -->

      <smc-wrap>
        <!-- Text Boxes - You can add as many as you like -->
        <smc-text-outer>
          <smc-text
            class="smc-text1 smc-animated smc-bounceInDown smc-animDelay4"
            data-edits="text1"
            data-changes=".smc-text1|font-size,color,margin-top,margin-bottom"
            >{text1}</smc-text
          >
          <smc-text
            class="smc-text2 smc-animated smc-bounceInDown smc-animDelay6"
            data-edits="text2"
            data-changes=".smc-text2|font-size,color,margin-top,margin-bottom"
            >{text2}</smc-text
          >
          <smc-text
            class="smc-text3 smc-animated smc-bounceInDown smc-animDelay8"
            data-edits="text3"
            data-changes=".smc-text3|font-size,color,margin-top,margin-bottom"
            >{text3}</smc-text
          >
          <smc-text
            class="smc-text4 smc-animated smc-bounceInRight smc-animDelay10"
            data-edits="text4"
            data-changes=".smc-text4|font-size,color,margin-top,margin-bottom"
            >{text4}</smc-text
          >
        </smc-text-outer>
      </smc-wrap>

      <smc-cart class="smc-animated smc-bounceInUp smc-animDelay10">
        <smc-product>
          <smc-product-img>
            <!-- <img src="https://picsum.photos/200/200" alt="Product image"> -->
            <img src="https://cdn.smct.io/75390-851.png" alt="Product image" />
          </smc-product-img>

          <smc-details>
            <smc-product-name>Product Name Here</smc-product-name>
            <smc-product-desc>description goes here</smc-product-desc>
          </smc-details>

          <smc-prices>
            <smc-product-oldprice>$12.34</smc-product-oldprice>
            <smc-product-price>$7.89</smc-product-price>
          </smc-prices>
        </smc-product>
      </smc-cart>

      <!-- Click To Redirect Option -->
      <smc-option class="smc-clickRedirect">
        <smc-input-group>
          <span
            class="smc-button smc-animated smc-bounceInUp smc-animDelay12"
            data-edits="text10"
            data-changes=".smc-button|font-size,background-color,color"
            >{text10}</span
          >
        </smc-input-group>
      </smc-option>

      <!-- Closers (Both Need) -->
      <smc-long-close
        class="smc-animated smc-fadeInUp smc-animDelay14"
        data-engage-class="smc-engaged"
      >
        <a
          data-close-type="long_close"
          class="smc-link smc-closer"
          href="#rdl"
          data-engage-text="{text11}"
          data-edits="text7,text11"
          data-changes="smc-long-close a.smc-link|font-size,color,margin-top,margin-bottom"
          >{text7}</a
        >
        <!-- Note - Redirect Link gets automatically rewritten, once clicked on the data-engage text and classes are applied -->
      </smc-long-close>

      <smc-close class="smc-animated smc-fadeInRight smc-animDelay4 smc-closer">
        <a data-close-type="x_close" class="smc-link" href="#rdl">✕</a
        ><!-- Note - Redirect Link gets automatically rewritten -->
      </smc-close>

      <!-- Success Message -->
      <smc-success-message class="smc-animated smc-fadeIn">
        <smc-success-message-inner
          class="smc-animated smc-bounceInDown smc-animDelay1"
        >
          Perfect thank you!
          <smc-success-close>X</smc-success-close>
        </smc-success-message-inner>
      </smc-success-message>

      <!-- CSS Loader -->
      <smc-loader-bg data-theme="white"
        ><!-- white, black-->
        <smc-loader-single></smc-loader-single
        ><!-- single, double, pulse -->
      </smc-loader-bg>

      <!-- Copy to Clipboard Success Message -->
      <smc-cp-msg>"{vc}" has been copied to the clipboard</smc-cp-msg>
    </smc-overlay-inner>
    <smc-shake-msg>
      <i class="fa fa-mobile" aria-hidden="true"></i><br />
      Shake To Reaveal Voucher
    </smc-shake-msg>
  </smc-overlay-outer>

  <!-- Safe close - Used when Autoscaling is turned on -->
  <smc-close-safe class="smc-closer">
    <a data-close-type="x_close" class="smc-link" href="#rdl">[close]</a
    ><!-- Note - Redirect Link gets automatically rewritten -->
  </smc-close-safe>
</smc-bg>

<!-- SmarterBar -->
<smc-bar class="smc-animated smc-fadeInDown">
  <smc-bar-close>X</smc-bar-close>
  <smc-bar-text>{smarterbar}</smc-bar-text>
  <smc-handle>
    <span class="smc-bar1"></span>
    <span class="smc-bar2"></span>
    <span class="smc-bar3"></span>
  </smc-handle>
</smc-bar>

<!-- Final Mesage Box -->
<smc-final-message class="smc-animated smc-fadeInDown"
  >Thanks... your code is: {vc}<smc-final-message-close
    >X</smc-final-message-close
  ></smc-final-message
>
